services:
  download-dashboards:
    image: alpine:latest
    container_name: download-dashboards
    # Liste des URLs des dashboards JSON à télécharger
    command: >
      sh -c "
      apk add --no-cache curl &&
      curl -fSL https://grafana.com/api/dashboards/1860/revisions/45/download -o /dashboards/node-exporter.json &&
      curl -fSL https://grafana.com/api/dashboards/19724/revisions/1/download -o /dashboards/cadvisor.json &&
      sed -i 's/$$\{DS_PROMETHEUS\}/prometheus_main/g' /dashboards/cadvisor.json
      "
    volumes:
      - ./grafana/provisioning/dashboards/json:/dashboards
    user: root

  generate-certs:
    image: alpine:latest
    container_name: generate-certs
    # Génère un certificat TLS auto-signé pour Grafana s'il n'existe pas déjà
    # (persistant dans le volume grafana_certs, donc regénéré uniquement au
    # premier démarrage ou après suppression du volume).
    # GRAFANA_CERT_SAN liste les noms/IP supplémentaires à inclure dans le
    # certificat (ex: DNS:mon-domaine,IP:1.2.3.4) ; en déploiement Ansible,
    # le docker-compose.override.yml généré y injecte l'IP du serveur cible.
    environment:
      - GRAFANA_CERT_SAN=${GRAFANA_CERT_SAN:-DNS:localhost,IP:127.0.0.1}
    command: >
      sh -c "
      apk add --no-cache openssl &&
      if [ ! -f /certs/grafana.crt ]; then
      openssl req -x509 -nodes -days 825 -newkey rsa:2048 -keyout /certs/grafana.key -out /certs/grafana.crt -subj '/CN=grafana' -addext subjectAltName=$$GRAFANA_CERT_SAN;
      fi &&
      chmod 644 /certs/grafana.crt /certs/grafana.key
      "
    volumes:
      - grafana_certs:/certs
    user: root

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/console_templates'
      - '--web.enable-lifecycle'
    expose:
      - "9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      download-dashboards:
        condition: service_completed_successfully
      generate-certs:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
      - grafana_certs:/etc/grafana/certs:ro
    environment:
      # HTTPS natif avec le certificat auto-signé généré par generate-certs :
      # le port 3000 ne sert plus que du HTTPS, le HTTP y est désactivé.
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/certs/grafana.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/certs/grafana.key
    # Identifiants par défaut : admin / admin (changement forcé à la 1re
    # connexion). En déploiement Ansible, le docker-compose.override.yml
    # généré injecte les identifiants du vault.

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"

volumes:
  prometheus_data:
  grafana_data:
  grafana_certs:
